<!-- แทนที่โค้ดส่วน <script> ด้านล่างในไฟล์ admin.html เดิมของคุณ -->
<script type="module">
    import { db, collection, addDoc } from './firebase-config.js';

    const map = L.map('map').setView([16.4322, 102.8236], 13); 
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let marker;

    map.on('click', function(e) {
        if(marker) map.removeLayer(marker);
        marker = L.marker(e.latlng).addTo(map);
        document.getElementById('lat').value = e.latlng.lat;
        document.getElementById('lng').value = e.latlng.lng;
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
        const name = document.getElementById('stationName').value;
        const lat = parseFloat(document.getElementById('lat').value);
        const lng = parseFloat(document.getElementById('lng').value);

        if(!name || !lat) return alert("กรุณากรอกชื่อและปักหมุดบนแผนที่");

        document.getElementById('saveBtn').innerText = "กำลังสร้าง...";

        try {
            const docRef = await addDoc(collection(db, "stations"), {
                name: name,
                lat: lat,
                lng: lng,
                createdAt: new Date()
            });

            // แก้ไขจุดนี้: เปลี่ยนให้ชี้ไปที่ index.html
            const baseUrl = window.location.href.replace('admin.html', '');
            const userUrl = `${baseUrl}index.html?id=${docRef.id}`;
            
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: userUrl,
                width: 250, // ปรับ QR ให้ใหญ่ขึ้นด้วย
                height: 250,
                colorDark : "#0D2118",
                colorLight : "#FFFFFF"
            });
            document.getElementById('qrLink').innerText = userUrl;
            document.getElementById('saveBtn').innerText = "บันทึก & สร้าง QR Code";
            
        } catch (e) {
            console.error("Error adding document: ", e);
            alert("เกิดข้อผิดพลาด");
        }
    });
</script>
